name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing: GitHub proves who is publishing, no npm token needed.
  # Set up once on npmjs.com → @nodari-pruidze/form-builder-js → Settings → Trusted publishing.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1+
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      # Opens a "Version Packages" PR while changesets are pending;
      # once that PR is merged, publishes the new version to npm.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
